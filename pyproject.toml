[project]
name = "llm-audit-bench"
version = "2.4.0"
description = "AuditBench v2 serving benchmark and Capability Check v2 model gate for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
audit-bench = "audit_bench:main"
capability-check = "capability_check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The modules stay importable as plain files under src/: consumers add
# <checkout>/src to PYTHONPATH or rsync the two files next to their
# adapters, so they must remain single self-contained modules.
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["audit_bench", "capability_check"]
